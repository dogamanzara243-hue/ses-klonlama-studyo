<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Türkçe Yapay Zeka Seslendirme Stüdyosu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
    <div>
      <h1 class="text-2xl font-bold text-indigo-400">🎙️ Türkçe AI Seslendirme Stüdyosu</h1>
      <p class="text-sm text-slate-400 mt-1">
        Metnini yaz, Türkçe ses karakterini ve hızını seç, saniyeler içinde doğal seslendirme (.mp3) indir.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">API Sunucu Adresi (Gradio / Colab Linki)</label>
      <input
        id="apiUrl"
        type="url"
        placeholder="https://xxxx.gradio.live"
        class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
      />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Ses Seçimi</label>
        <select id="voiceSelect" class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          <option value="tr-TR-AhmetNeural">Ahmet (Türkçe - Doğal Erkek)</option>
          <option value="tr-TR-EmelNeural">Emel (Türkçe - Doğal Kadın)</option>
        </select>
      </div>
      <div>
        <div class="flex justify-between text-xs text-slate-400 mb-1">
          <span>Konuşma Hızı</span>
          <span id="rateLabel">+5%</span>
        </div>
        <input id="rateInput" type="range" min="-20" max="30" step="5" value="5" class="w-full mt-2" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">Seslendirilecek Türkçe Metin</label>
      <textarea id="scriptText" rows="5" placeholder="Örn: Merhaba minik dostum! Bugün seninle gökyüzündeki sevimli bulutların sırrını keşfedeceğiz." class="w-full rounded-lg bg-slate-800 border border-slate-700 p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
    </div>

    <button id="generateBtn" type="button" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm transition">
      ✨ Türkçe Seslendirmeyi Oluştur
    </button>

    <div id="statusMsg" class="text-sm text-amber-300 hidden"></div>

    <div id="resultBox" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
      <div class="text-sm font-semibold text-emerald-400">Seslendirme Hazır!</div>
      <audio id="resultAudio" controls class="w-full"></audio>
      <a id="downloadLink" download="turkce_seslendirme.mp3" class="inline-block px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold">⬇️ MP3 Dosyasını İndir</a>
    </div>
  </div>

  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

    const apiUrlEl = document.getElementById("apiUrl");
    const voiceSelect = document.getElementById("voiceSelect");
    const rateInput = document.getElementById("rateInput");
    const rateLabel = document.getElementById("rateLabel");
    const generateBtn = document.getElementById("generateBtn");
    const statusMsg = document.getElementById("statusMsg");
    const resultBox = document.getElementById("resultBox");
    const resultAudio = document.getElementById("resultAudio");
    const downloadLink = document.getElementById("downloadLink");

    apiUrlEl.value = localStorage.getItem("edge_tts_api_url") || "";
    apiUrlEl.addEventListener("change", () => localStorage.setItem("edge_tts_api_url", apiUrlEl.value.trim()));
    rateInput.addEventListener("input", () => {
      const val = Number(rateInput.value);
      rateLabel.textContent = val >= 0 ? `+${val}%` : `${val}%`;
    });

    function showStatus(msg, isError = false) {
      statusMsg.textContent = msg;
      statusMsg.className = `text-sm ${isError ? "text-rose-400" : "text-amber-300"}`;
      statusMsg.classList.remove("hidden");
    }

    generateBtn.addEventListener("click", async () => {
      const baseUrl = apiUrlEl.value.trim().replace(/\/+$/, "");
      const text = document.getElementById("scriptText").value.trim();
      const voice = voiceSelect.value;
      const rateVal = Number(rateInput.value);
      const rateStr = rateVal >= 0 ? `+${rateVal}%` : `${rateVal}%`;

      if (!baseUrl) return showStatus("Lütfen Gradio API adresini yapıştırın.", true);
      if (!text) return showStatus("Lütfen seslendirilecek metni yazın.", true);

      resultBox.classList.add("hidden");
      generateBtn.disabled = true;
      showStatus("Türkçe seslendirme hazırlanıyor...");

      try {
        const client = await Client.connect(baseUrl);
        const result = await client.predict("/ses_uret", {
          metin: text,
          ses: voice,
          hiz: rateStr,
        });
        const audioData = result.data[0];
        const audioUrl = audioData.url || audioData;
        resultAudio.src = audioUrl;
        downloadLink.href = audioUrl;
        resultBox.classList.remove("hidden");
        statusMsg.classList.add("hidden");
      } catch (err) {
        showStatus(`Hata: ${err.message}`, true);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
