<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kendi Sesinle Seslendirme Stüdyosu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
    <div>
      <h1 class="text-2xl font-bold text-indigo-400">🎙️ Kendi Sesinle Seslendirme</h1>
      <p class="text-sm text-slate-400 mt-1">
        5–10 saniyelik temiz ses kaydını yükle veya kaydet, metnini yaz ve kendi sesinle seslendirme üret.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">API Sunucu Adresi</label>
      <input
        id="apiUrl"
        type="url"
        placeholder="https://kullanici-ses-klonlama.hf.space"
        class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
      />
    </div>

    <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span class="text-sm font-semibold text-slate-200">1. Referans Ses (5–10 sn önerilir)</span>
        <div class="flex gap-2">
          <button
            id="recordBtn"
            type="button"
            class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-medium"
          >
            ● Mikrofon Kaydet
          </button>
          <button
            id="stopBtn"
            type="button"
            disabled
            class="px-3 py-1.5 rounded-lg bg-rose-600 disabled:opacity-40 text-xs font-medium"
          >
            ■ Durdur
          </button>
        </div>
      </div>

      <input
        id="audioFile"
        type="file"
        accept="audio/*"
        class="block w-full text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"
      />
      <p id="refStatus" class="text-xs text-slate-400">Henüz referans ses seçilmedi.</p>
      <audio id="refPreview" controls class="w-full hidden"></audio>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-1">2. Seslendirilecek Metin</label>
      <textarea
        id="scriptText"
        rows="4"
        placeholder="Kendi sesinle okunmasını istediğin metni buraya yaz..."
        class="w-full rounded-lg bg-slate-800 border border-slate-700 p-3 text-sm focus:outline-none focus:border-indigo-500"
      ></textarea>
    </div>

    <div>
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span>Konuşma Hızı</span>
        <span id="speedLabel">1.0x</span>
      </div>
      <input id="speedInput" type="range" min="0.7" max="1.3" step="0.05" value="1.0" class="w-full" />
    </div>

    <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer">
      <input id="consentBox" type="checkbox" class="mt-0.5 rounded bg-slate-800 border-slate-600" />
      <span>Yüklediğim/kaydettiğim sesin bana ait olduğunu veya bu sesi klonlamak için iznim olduğunu onaylıyorum.</span>
    </label>

    <button
      id="generateBtn"
      type="button"
      class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm transition"
    >
      ✨ Seslendirmeyi Oluştur
    </button>

    <div id="statusMsg" class="text-sm text-amber-300 hidden"></div>

    <div id="resultBox" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
      <div class="text-sm font-semibold text-emerald-400">Seslendirme Hazır!</div>
      <audio id="resultAudio" controls class="w-full"></audio>
      <a
        id="downloadLink"
        download="klonlanmis_ses.wav"
        class="inline-block px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold"
      >
        ⬇️ WAV Dosyasını İndir
      </a>
    </div>
  </div>

  <script>
    const apiUrlEl = document.getElementById("apiUrl");
    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const audioFileEl = document.getElementById("audioFile");
    const refStatus = document.getElementById("refStatus");
    const refPreview = document.getElementById("refPreview");
    const speedInput = document.getElementById("speedInput");
    const speedLabel = document.getElementById("speedLabel");
    const generateBtn = document.getElementById("generateBtn");
    const statusMsg = document.getElementById("statusMsg");
    const resultBox = document.getElementById("resultBox");
    const resultAudio = document.getElementById("resultAudio");
    const downloadLink = document.getElementById("downloadLink");

    apiUrlEl.value = localStorage.getItem("voice_api_url") || "";
    apiUrlEl.addEventListener("change", () => localStorage.setItem("voice_api_url", apiUrlEl.value.trim()));

    speedInput.addEventListener("input", () => {
      speedLabel.textContent = `${Number(speedInput.value).toFixed(2)}x`;
    });

    let recordedBlob = null;
    let mediaRecorder = null;
    let chunks = [];

    recordBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(chunks, { type: "audio/webm" });
          audioFileEl.value = "";
          const url = URL.createObjectURL(recordedBlob);
          refPreview.src = url;
          refPreview.classList.remove("hidden");
          refStatus.textContent = "Mikrofon kaydı hazır.";
          stream.getTracks().forEach((t) => t.stop());
        };
        mediaRecorder.start();
        recordBtn.disabled = true;
        stopBtn.disabled = false;
        refStatus.textContent = "Kayıt alınıyor... (5–10 saniye net konuşun)";
      } catch {
        refStatus.textContent = "Mikrofon izni verilmedi veya cihaz desteklemiyor.";
      }
    });

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      recordBtn.disabled = false;
      stopBtn.disabled = true;
    });

    audioFileEl.addEventListener("change", () => {
      if (audioFileEl.files[0]) {
        recordedBlob = null;
        const url = URL.createObjectURL(audioFileEl.files[0]);
        refPreview.src = url;
        refPreview.classList.remove("hidden");
        refStatus.textContent = `Seçilen dosya: ${audioFileEl.files[0].name}`;
      }
    });

    function showStatus(msg, isError = false) {
      statusMsg.textContent = msg;
      statusMsg.className = `text-sm ${isError ? "text-rose-400" : "text-amber-300"}`;
      statusMsg.classList.remove("hidden");
    }

    generateBtn.addEventListener("click", async () => {
      const baseUrl = apiUrlEl.value.trim().replace(/\/+$/, "");
      const text = document.getElementById("scriptText").value.trim();
      const consent = document.getElementById("consentBox").checked;
      const fileToSend = recordedBlob
        ? new File([recordedBlob], "mikrofon_kaydi.webm", { type: "audio/webm" })
        : audioFileEl.files[0];

      if (!baseUrl) return showStatus("Lütfen önce API sunucu adresini girin.", true);
      if (!fileToSend) return showStatus("Lütfen bir referans ses kaydedin veya yükleyin.", true);
      if (!text) return showStatus("Lütfen seslendirilecek metni yazın.", true);
      if (!consent) return showStatus("Devam etmek için ses kullanım onay kutusunu işaretleyin.", true);

      resultBox.classList.add("hidden");
      generateBtn.disabled = true;
      showStatus("Ses klonlanıyor, lütfen bekleyin...");

      const formData = new FormData();
      formData.append("text", text);
      formData.append("ref_audio", fileToSend);
      formData.append("speed", speedInput.value);
      formData.append("consent", String(consent));

      try {
        const res = await fetch(`${baseUrl}/api/clone-voice`, {
          method: "POST",
          body: formData,
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Sunucu hatası (${res.status})`);
        }
        const wavBlob = await res.blob();
        const audioUrl = URL.createObjectURL(wavBlob);
        resultAudio.src = audioUrl;
        downloadLink.href = audioUrl;
        resultBox.classList.remove("hidden");
        statusMsg.classList.add("hidden");
      } catch (err) {
        showStatus(`Hata: ${err.message}`, true);
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
        </html>
